[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-hunter"
version = "0.1.0"
description = "메이플스토리 계열 사설 서버용 사냥/버프/룬 해제 매크로 (Windows, PySide6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
rune-hunter = "rune_hunter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["bench: 성능 측정용 테스트 (느릴 수 있음)"]
